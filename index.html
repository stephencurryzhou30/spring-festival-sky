<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2b0917">
<title>周家花火夜 · 新春弹幕夜</title>
<link rel="stylesheet" href="./sky.css">
<header><a class="brand" href="#sky"><i>✺</i> 周家花火夜</a><span>新春弹幕夜</span><a class="wallLink" href="#wall">祝福墙</a></header>
<main>
<section id="sky" aria-label="新春烟花夜空">
<canvas aria-hidden="true"></canvas><div id="stream" aria-hidden="true"></div>
<div class="intro"><p class="kicker">✦ &nbsp; 新 春 共 赏</p><h1>今夜，<br><em>花火正好。</em></h1><p>把想说的话，送上同一片夜空。</p>
<div class="actions"><button id="write">✎ &nbsp; 写下祝福</button><button id="burst" class="outline">✺ &nbsp; 放烟花</button></div></div>
</section>
<section id="wall"><div class="wallHead"><h2><span>✳</span> 祝福墙</h2><button class="quiet" id="refresh">↻ &nbsp; 刷新留言</button></div>
<p id="status" role="status">正在收取祝福…</p><div id="cards"></div><button id="more" hidden>查看更多</button></section>
</main>
<dialog id="composer"><form method="dialog"><button class="close" aria-label="关闭">×</button></form><p class="kicker">✦ &nbsp; 新春来信</p><h2>写下你的祝福</h2><label for="nickname">昵称（选填）</label><input id="nickname" maxlength="16" placeholder="匿名朋友"><label for="wish">想送上夜空的话</label><textarea id="wish" maxlength="80" rows="3" placeholder="愿我们常相见，共看好风景。"></textarea><div class="count"> <span id="length">0</span> / 80</div><p id="feedback" role="status">祝福将公开展示在弹幕和祝福墙上。</p><button class="primary" id="send" type="button">发送祝福</button></dialog>
<script type="module" src="./app.js"></script></html>
