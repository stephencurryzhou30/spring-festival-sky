<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2b0917">
<title>花火来信 · 新春弹幕夜</title>
<link rel="stylesheet" href="./sky.css">
<header><a class="brand" href="#sky"><i>✺</i> 花火来信</a><span>新春弹幕夜</span><a class="wallLink" href="#wall">祝福墙</a></header>
<main>
<section id="sky" aria-label="新春烟花夜空">
<canvas aria-hidden="true"></canvas><div id="stream" aria-hidden="true"></div>
<div class="intro"><p class="kicker">✦ &nbsp; 新 春 共 赏</p><h1>今夜，<br><em>花火正好。</em></h1><p>把想说的话，送上同一片夜空。</p>
<div class="actions"><button id="write">✎ &nbsp; 写下祝福</button><button id="burst" class="outline">✺ &nbsp; 放烟花</button></div></div>
<div class="sceneFoot"><span>✧ &nbsp; 花火来信 · 新春夜场</span><button id="motion" aria-pressed="false">暂停动效</button></div>
</section>
<section id="wall"><div class="wallHead"><h2><span>✳</span> 祝福墙</h2><button class="quiet" id="refresh">↻ &nbsp; 刷新留言</button></div>
<p id="status" role="status">正在收取祝福…</p><div id="cards"></div><button id="more" hidden>查看更多</button></section>
</main>
<dialog id="composer"><form method="dialog"><button class="close" aria-label="关闭">×</button></form><p class="kicker">✦ &nbsp; 新春来信</p><h2>写下你的祝福</h2><label for="wish">想送上夜空的话</label><textarea id="wish" maxlength="80" rows="3" placeholder="愿我们常相见，共看好风景。"></textarea><div class="count"> <span id="length">0</span> / 80</div><p>下一步将打开 GitHub。登录并提交后，所有访客都能看到你的账号名和祝福。</p><a class="primary" id="send" target="_blank" rel="noopener noreferrer">前往 GitHub 发表</a></dialog>
<script type="module" src="./app.js"></script></html>
