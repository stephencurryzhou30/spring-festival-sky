name: Publish festival sky
on:
  push:
    branches: [main]
  issues:
    types: [opened, edited, deleted, transferred, closed, reopened]
  workflow_dispatch:
    inputs:
      probe:
        description: Optional UUID for a temporary anonymous wish round-trip check
        required: false
        type: string
concurrency:
  group: festival-pages
  cancel-in-progress: false
permissions:
  contents: read
  issues: read
  pages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - run: mkdir public && cp index.html sky.css app.js scene.js public/
      - uses: actions/github-script@v7
        with:
          script: |
            const wishes = []
            for await (const {data} of github.paginate.iterator(github.rest.issues.listForRepo, {
              ...context.repo, state:'all', sort:'created', direction:'desc', per_page:100
            })) {
              for (const issue of data) {
                if (issue.pull_request || !issue.title.startsWith('【新春祝福】')) continue
                const body = issue.title.slice('【新春祝福】'.length).trim()
                if (body) wishes.push({id:issue.id,title:'【新春祝福】'+body.slice(0,80),user:{login:issue.user?.login || '朋友'}})
              }
            }
            require('node:fs').writeFileSync('public/wishes.json', JSON.stringify(wishes))
      - name: Check anonymous wish delivery
        if: github.event_name == 'workflow_dispatch' && inputs.probe != ''
        env:
          PROBE_ID: ${{ inputs.probe }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          const url='https://spring-festival-wishes.stephencurryzhou30-festival.workers.dev/wishes'
          const origin='https://stephencurryzhou30.github.io'
          const post=()=>fetch(url,{method:'POST',headers:{Origin:origin,'Content-Type':'application/json'},
            body:JSON.stringify({requestId:process.env.PROBE_ID,nickname:'',message:'新春留言连通性验证'})})
          const first=await post()
          assert.equal(first.status,201)
          assert.equal(first.headers.get('access-control-allow-origin'),origin)
          const wish=await first.json()
          assert.equal(wish.nickname,'匿名朋友')
          assert.equal((await (await post()).json()).id,wish.id)
          const {items}=await (await fetch(url)).json()
          assert(items.some(item=>item.id===wish.id && item.message===wish.message))
          JS
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: publish
